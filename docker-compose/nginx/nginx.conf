server {
    listen 80;
    server_name thanhserver123.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thanhserver123.me;

    ssl_certificate /etc/nginx/certs/fullchain.pem; 
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 100M;
    # Point to the shared volume
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /files/ {
            rewrite ^/files/(.*) /$1 break;
            proxy_pass http://minio:9000;
            add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location ^~ /recordings/ {
            proxy_pass http://nginx:80/recordings/;
            add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location ~ "\.(m3u8|ts)$" {
            proxy_pass http://ome:3333;
            add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /api/chat/ {
            proxy_pass http://chat-service:8001;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://traefik:8081;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter 'http://minio:9000' 'https://thanhserver123.me/files';
        sub_filter 'http://128.199.90.123:9000' 'https://thanhserver123.me/files';
        sub_filter_once off;
    }

    location /ws/ {
        proxy_pass http://chat-service:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
