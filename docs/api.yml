openapi: 3.1.0

info:
  title: Server Management API
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local development server
  - url: https://thanhserver123.me
    description: Remote server
tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: Users management operations
  - name: Categories
  - name: Streams
  - name: Notifications
  - name: Donations
  - name: Wallets

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      security:
        - BearerAuth: [ 'users:create' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        200:
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        409:
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          headers:
            Set-Cookie:
              description: Http only cookies contains refresh token
              schema:
                type: string
        404:
          description: User not found (wrong email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid input format (malformed request body) or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /auth/logout:
    post:
      summary: Logout current sessions
      tags:
        - Auth
      security:
        - BearerAuth: [ ]
      responses:
        200:
          description: Logout successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          headers:
            Set-Cookie:
              description: Server send this cookies to remove current cookies.
              schema:
                type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: "Refresh Access Token"
      security: [ ]
      responses:
        200:
          description: Access token refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
          headers:
            Set-Cookie:
              description: Http only cookies contains refresh token
              schema:
                type: string
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /auth/verify:
    get:
      tags:
        - Auth
      security:
        - BearerAuth: [ ]
      responses:
        204:
          description: Valid access token
          headers:
            X-User-Id:
              schema:
                type: string
            X-User-Role:
              schema:
                type: string
        401:
          description: Invalid access token (unauthorized)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /users:
    get:
      tags:
        - Users
      security:
        - BearerAuth: [ "users:read" ]
      summary: Get users list, users will be sorted by id
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [ asc, desc ]
            default: asc
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  schema:
                    $ref: '#/components/schemas/UserInfoResponse'
        400:
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user info by id
      security:
        - BearerAuth: [ "users:read" ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /users/me:
    get:
      tags:
        - Users
      summary: Get user info by id
      security:
        - BearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
    patch:
      tags:
        - Users
      summary: Update user info
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInfoRequest'
      responses:
        200:
          description: User info updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        409:
          description: User mail already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /users/me/password:
    put:
      tags:
        - Users
      summary: Update user password
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        200:
          description: User password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        400:
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels:
    post:
      tags: [Channels]
      summary: Create channel for current user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreate'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/self:
    patch:
      tags: [Channels]
      summary: Update current user's channel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/self/avatar:
    put:
      tags: [ Channels ]
      summary: Set user avatar
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Avatar image file to upload
      responses:
        '200':
          description: Avatar set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/self/background:
    put:
      tags: [ Channels ]
      summary: Set channel background
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Background image file to upload
      responses:
        '200':
          description: Background set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/subscription:
    post:
      tags: [ Channels ]
      summary: Create subscription
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/subscription/{channelId}:
    get:
      tags: [ Channels ]
      summary: Get subscription
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
          description: Channel id (UUID)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
    patch:
      tags: [ Channels ]
      summary: Update subscription
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
          description: Channel id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
    delete:
      tags: [ Channels ]
      summary: Delete subscription
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
          description: Channel id (UUID)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /channels/follower:
    get:
      tags: [ Channels ]
      summary: Get channel followers
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
  /channels/following:
    get:
      tags: [ Channels ]
      summary: Get following channel
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
  /public/channels/{channelId}:
    get:
      tags: [Channels]
      summary: Get channel by id (public)
      security: [ ]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
          description: Channel id (UUID)
      responses:
        '200':
          description: Channel found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          description: Channel not found
  /public/channels/search:
    post:
      tags: [Channels]
      summary: Search channels by text
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTextRequest'
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
  /public/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by id (public)
      security: [ ]
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
  /categories:
    post:
      tags: [Categories]
      summary: Create category
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Categories delete successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /categories/{id}:
    delete:
      tags: [ Categories ]
      summary: Delete category
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Categories delete successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /categories/{categoryID}/image:
    put:
      tags: [ Categories ]
      summary: Set categories image
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: categoryID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description:  image file to upload
      responses:
        '200':
          description: image set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /public/categories/search:
    post:
      tags: [Categories]
      summary: Search categories by text
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTextRequest'
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /streams:
    post:
      tags: [Streams]
      summary: Create stream
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamCreate'
      responses:
        '201':
          description: Stream created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
  /streams/thumbnail/{streamId}:
    put:
      tags: [Streams]
      summary: Set stream thumbnail
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: streamId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Thumbnail image file to upload
      responses:
        '200':
          description: Thumbnail set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /public/streams/{streamId}:
    get:
      tags: [Streams]
      summary: Get stream by id (public)
      security: [ ]
      parameters:
        - in: path
          name: streamId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStream'
  /public/streams/channels/{channelId}:
    get:
      tags: [Streams]
      summary: Get streams by channel id
      security: [ ]
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: List of streams for channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetStream'
  /public/streams/search:
    post:
      tags: [Streams]
      summary: Search streams by text
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSearchRequest'
      responses:
        '200':
          description: List of streams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetStream'
  /notifications:
    get:
      tags: [ Notifications ]
      summary: Get notifications
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /notifications/read:
    put:
      tags: [ Notifications ]
      summary: Mark notifications as read
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadNotificationReq'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /donations:
    post:
      tags: [ Donations ]
      summary: Create donate transactions
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonateTransactionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDonateRes'
  /donations/{txID}:
    get:
      tags: [ Donations ]
      summary: Get donate transaction by ID
      security:
        - BearerAuth: [ ]
      parameters:
        - in: path
          name: txID
          required: true
          schema:
            type: string
          description: Transaction id (UUID)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonateTxRes'
  /donations/donate:
    post:
      tags: [ Donations ]
      summary: Get donate transactions
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDonateRequest'
      responses:
        '200':
          description: List of donate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonateTxRes'
  /donations/receive:
    post:
      tags: [ Donations ]
      summary: Get receive donate transactions
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDonateRequest'
      responses:
        '200':
          description: List of donate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DonateTxRes'
  /donations/statistics:
    post:
      tags: [ Donations ]
      summary: Get donate statistics transactions
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDonateStatsRequest'
      responses:
        '200':
          description: Donate statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatisticsResult'
  /donations/received-statistics:
    post:
      tags: [ Donations ]
      summary: Get received donate statistics transactions
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDonateStatsRequest'
      responses:
        '200':
          description: Donate statistics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatisticsResult'
  /wallets/self:
    get:
      tags: [ Wallets ]
      summary: Get donate transaction by ID
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: List of donate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Response:
      type: object
      properties:
        message:
          type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          required: true
        password:
          type: string
          format: password
          required: true
        first_name:
          type: string
          required: true
        last_name:
          type: string
          required: true
    UserInfoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
